<!doctype html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>Playlist Presentation</title>
  <style>
    :root {
      --bg: #000;
      --text: #fff;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
      animation: windowFadeIn 0.15s ease-in forwards;
    }

    @keyframes windowFadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @font-face {
      font-family: "TamilBibleFont";
      src: url("fonts/NotoSansTamil-SemiBold.ttf") format("truetype");
    }

    #container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    #container.fade-out {
      opacity: 0;
      transition: opacity 0.2s ease-out;
    }

    #container.fade-in {
      opacity: 1;
      transition: opacity 0.3s ease-in;
    }

    #referenceArea {
      min-height: 5%;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 3.5vh;
      padding-bottom: 0.8vh;
    }

    #reference {
      font-weight: bold;
      font-family: "TamilBibleFont", Arial, sans-serif;
      text-decoration: underline;
      text-decoration-color: #b4b4b4ec;
      text-underline-offset: 5px;
      text-decoration-skip-ink: none;
      color: #fff;
      text-align: center;
      white-space: nowrap;
    }

    #verseArea {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.5vh 1vw 0;
    }

    #verseBox {
      width: 100%;
      max-height: 95%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.2vh;
      text-align: center;
      overflow: hidden;
    }

    #tamilText {
      font-family: "TamilBibleFont", Arial, sans-serif;
      font-weight: 900;
      line-height: 1.28;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    #englishText {
      font-weight: 600;
      line-height: 1.35;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .word-shrink {
      display: inline-block;
      max-width: 100%;
      overflow: visible;
      white-space: nowrap;
      /* Prevent individual words from wrapping internally */
    }

    #watermark {
      position: absolute;
      bottom: 15px;
      right: 25px;
      font-size: 1.5vw;
      opacity: 1.5;
      z-index: 100;
    }

    #bgLayer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background-color: #000;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition: background-image 0.5s ease, background-color 0.5s ease;
    }

    /* GLOBAL FADE-IN ON OPEN */
    body {
      opacity: 0;
      transition: opacity 0.3s ease-in;
    }

    body.ready {
      opacity: 1;
    }

    #presentationExit {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 2000;
      width: 44px;
      height: 44px;
      border: 1.5px solid rgba(255, 255, 255, 0.45);
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.35);
      color: rgba(255, 255, 255, 0.9);
      font: 28px/1 Arial, sans-serif;
      cursor: pointer;
      opacity: 0.35;
      outline: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 160ms ease, background 160ms ease, transform 160ms ease;
    }

    #presentationExit:hover,
    #presentationExit:focus-visible {
      opacity: 0.95;
      background: rgba(220, 38, 38, 0.85);
      border-color: rgba(255, 255, 255, 0.9);
      transform: scale(1.05);
      outline: none;
    }
  </style>
</head>

<body>
  <button id="presentationExit" type="button" hidden aria-label="Exit presentation" title="Exit presentation">×</button>
  <div id="bgLayer"></div>
  <div id="container">
    <div id="referenceArea">
      <div id="reference"></div>
    </div>
    <div id="verseArea">
      <div id="verseBox">
        <div id="tamilText"></div>
        <div id="englishText"></div>
      </div>
    </div>
    <div id="mediaArea" style="
          display: none;
          width: 100%;
          height: 100%;
          position: absolute;
          top: 0;
          left: 0;
          align-items: center;
          justify-content: center;
          background: black;
          z-index: 10;
        ">
      <img id="mediaImg" style="width: 100%; height: 100%; object-fit: contain; display: none" />
      <video id="mediaVideo" style="width: 100%; height: 100%; object-fit: contain; display: none" autoplay controls></video>
    </div>
    <div id="watermark"></div>
  </div>
  <script src="lower_third.js"></script>
  <script>
    /* ---------- WORD OVERFLOW FIX ---------- */
    function fixWordOverflow(el, containerWidth) {
      if (!el) return;
      const words = el.querySelectorAll('.word-shrink');
      words.forEach(span => {
        span.style.fontSize = '';
        if (span.scrollWidth > containerWidth) {
          let fs = parseFloat(window.getComputedStyle(span).fontSize);
          while (span.scrollWidth > containerWidth && fs > 5) {
            fs -= 0.3; // Smaller decrements for smoother fit
            span.style.fontSize = fs + 'px';
          }
        }
      });
    }

    function wrapWords(text) {
      if (!text) return '';

      // Split by HTML tags. Capturing group ensures tags are kept in the split array.
      const tokens = text.split(/(<[^>]+>)/g);

      return tokens.map(token => {
        // If it's an HTML tag, return it untouched
        if (token.startsWith('<') && token.endsWith('>')) {
          return token;
        }

        // It's a text segment. Glue punctuation and wrap words.
        const glued = token.replace(/\s+([.,:;!?])/g, '$1');

        return glued
          .split(/(\n)/)
          .map(segment => {
            if (segment === '\n') return '<br>';

            // Split by whitespace characters, preserving them
            return segment
              .split(/(\s+)/)
              .map(part => {
                if (!part) return '';
                if (/^\s+$/.test(part)) return part; // Keep whitespace as-is
                return `<span class="word-shrink">${part}</span>`;
              })
              .join('');
          })
            .join('');
      }).join('');
    }

    function getSafeBgUrl(imgPath) {
      if (!imgPath) return 'none';
      const clean = imgPath.replace(/\\/g, '/');
      if (clean.startsWith('http') || clean.startsWith('data:')) return `url("${clean}")`;
      if (clean.startsWith('templates/') || clean.startsWith('/templates/')) {
        const tPath = clean.replace(/^\//, '');
        if (window.location.protocol === 'blob:') {
          return `url("/${tPath}")`;
        } else if (window.location.href.includes('/dist/electron/') || window.location.href.includes('/app.asar/')) {
          return `url("../${tPath}")`;
        } else {
          return `url("../public/${tPath}")`;
        }
      }
      if (!clean.startsWith('file:///')) return `url("file:///${clean}")`;
      return `url("${clean}")`;
    }

    function getVerseCount(indexStr) {
      if (!indexStr) return 1;
      const tamilEl = document.getElementById("tamilText");
      const tamilText = tamilEl ? (tamilEl.innerHTML || "") : "";
      const lines = tamilText.split("<br>").filter((l) => l.trim()).length;
      if (lines > 1) return lines;
      const str = String(indexStr);
      const rangeMatch = str.match(/:(\d+)-(\d+)/);
      if (rangeMatch)
        return parseInt(rangeMatch[2]) - parseInt(rangeMatch[1]) + 1;
      return 1;
    }

    function getVerseType(tamil, english) {
      const len = (tamil?.length || 0) * 1.2 + (english?.length || 0);
      if (len < 80) return "small";
      if (len > 250) return "large";
      return "medium";
    }

    function fitReference(refEl, data) {
      if (data && data.presentationLayout === 'lowerThird') {
        fitLowerThirdReference(refEl, data);
        return;
      }

      const text = (refEl.innerText || "").toLowerCase();
      const indexStr = data && data.index ? data.index : "";
      const verseCount = getVerseCount(indexStr);
      const isMultiVerse = verseCount > 1 || text.includes("-") || text.includes(",");
      const isSmallRef =
        text.includes("revelation") ||
        text.includes("வெளிப்படுத்தின") ||
        text.includes("thessalonians") ||
        text.includes("தெச");
      const isLongText = text.length > 20;

      let vw = (isSmallRef || (isMultiVerse && isLongText)) ? 4.2 : (isMultiVerse ? 4.8 : 5.5);
      refEl.style.fontSize = vw + "vw";

      const refAreaEl = document.getElementById("referenceArea");
      const containerWidth = refAreaEl ? refAreaEl.clientWidth : window.innerWidth;
      const targetWidth = containerWidth * 0.82; // Fill at least ~82% width area

      let safety = 0;
      if (refEl.scrollWidth > targetWidth) {
        while (refEl.scrollWidth > targetWidth && vw > 2.0 && safety < 100) {
          vw -= 0.1;
          refEl.style.fontSize = vw + "vw";
          safety++;
        }
      } else if (refEl.scrollWidth < targetWidth) {
        while (refEl.scrollWidth < targetWidth && vw < 6.8 && safety < 100) {
          vw += 0.1;
          refEl.style.fontSize = vw + "vw";
          safety++;
        }
        if (refEl.scrollWidth > targetWidth) {
          vw -= 0.1;
          refEl.style.fontSize = vw + "vw";
        }
      }

      // Apply font offsets
      const indexOffset = (data && data.indexFontOffset ? data.indexFontOffset : 0) * 0.15;
      const localOffset = (data && data.fontSizeOffset ? data.fontSizeOffset : 0) * 0.10;
      vw += indexOffset + localOffset;
      refEl.style.fontSize = vw + "vw";
    }

    function updateDisplay(data) {
      const exitButton = document.getElementById("presentationExit");
      const bgLayer = document.getElementById("bgLayer");
      const container = document.getElementById("container");
      const ref = document.getElementById("reference");
      const tamil = document.getElementById("tamilText");
      const eng = document.getElementById("englishText");
      const watermark = document.getElementById("watermark");
      const box = document.getElementById("verseBox");
      const verseArea = document.getElementById("verseArea");
      const refArea = document.getElementById("referenceArea");
      const mediaArea = document.getElementById("mediaArea");
      const mediaImg = document.getElementById("mediaImg");
      const mediaVideo = document.getElementById("mediaVideo");

      // Guard blank / null presentation
      if (!data || data.isBlank) {
        if (exitButton) exitButton.hidden = !(data && data.showExitControl);
        if (ref) ref.innerText = "";
        if (tamil) tamil.innerText = "";
        if (eng) eng.innerText = "";
        if (watermark) watermark.innerText = "";
        if (mediaArea) mediaArea.style.display = "none";
        if (mediaVideo) mediaVideo.pause();
        if (bgLayer) {
          bgLayer.style.backgroundImage = "none";
          bgLayer.style.backgroundColor = "#000000";
        }
        window.bgCache = { type: 'black', val: null, layout: 'fullscreen' };
        document.body.classList.add('ready');
        return;
      }

      if (data.fadeOutOnly) {
        document.body.style.transition = 'opacity 0.25s ease-out';
        document.body.style.opacity = '0';
        return;
      }

      // Show exit button only when presentation covers the primary display
      if (exitButton) exitButton.hidden = !(data.showExitControl && data.presentationLayout === "fullscreen");

      document.body.classList.add('ready');
      document.body.style.opacity = '';
      document.body.style.transition = '';

      // Handle inconsistent payload structures (nested vs flat from Prelist.jsx)
      const settings = data.settings || data;

      // Background - Cached logic via lower_third.js
      const layout = data.presentationLayout || settings.presentationLayout || "fullscreen";

      if (!window.bgCache) {
        window.bgCache = { type: null, val: null, layout: null };
      }

      // Shared DOM element references for lower_third.js
      const ltEls = { container, verseArea, refArea, box, bgLayer, watermark, ref, tamil, eng };

      // Handle Layout via shared module
      if (layout === 'lowerThird') {
        const shouldContinue = applyLowerThirdLayout(ltEls, data);
        if (!shouldContinue) return;
        applyLowerThirdBackground(bgLayer, settings, getSafeBgUrl);
      } else {
        resetToFullscreenLayout(ltEls);
        // Match presentation.html padding (3.5vh)
        refArea.style.paddingTop = '3.5vh';
        applyFullscreenBackground(bgLayer, settings, getSafeBgUrl);
      }

      // Text color (shared)
      const textColor = applyTextColor({ ref, tamil, eng }, settings, layout);
      if (watermark) {
        watermark.innerText = settings.customWatermark || "";
        watermark.style.color = textColor;
      }

      const applyContent = () => {
        // Check if it's a file
        if (data.type === "file") {
          console.log(
            "[PRESENTATION PRELIST] Handling file:",
            data.url,
            data.fileType,
          );

          // Hide Verse layers
          refArea.style.display = "none";
          verseArea.style.display = "none";

          // Show Media Area
          mediaArea.style.display = "flex";

          const fType = (data.fileType || data.fileData?.fileType || "").toLowerCase();
          const fName = (data.name || data.fileData?.name || data.url || "").toLowerCase();
          const isImage = fType.startsWith("image") || /\.(jpg|jpeg|png|webp|gif|bmp|svg)$/i.test(fName);
          const isVideo = fType.startsWith("video") || /\.(mp4|webm|mov|mkv|avi|flv|wmv|m4v|3gp|ts)$/i.test(fName);

          const normalizeUrl = (u) => {
            if (!u || typeof u !== "string") return "";
            if (/^[a-zA-Z]:[\\/]/.test(u)) return "local-file:///" + u.replace(/\\/g, "/");
            if (/^file:\/\/\//i.test(u)) return u.replace(/^file:\/\/\//i, "local-file:///");
            if (/^file:\/\//i.test(u)) return u.replace(/^file:\/\//i, "local-file:///");
            return u;
          };

          if (isImage) {
            const rawUrl =
              data.url &&
                ![
                  "[uploading]",
                  "[upload-failed]",
                  "[offline-or-failed-upload]",
                  "[local-file]",
                  "[local-only]",
                ].includes(data.url)
                ? data.url
                : (data.localPreview || data.localUrl || (data.path ? `local-file:///${data.path.replace(/\\/g, "/")}` : null));
            const displayUrl = normalizeUrl(rawUrl);

            if (displayUrl) {
              mediaImg.src = displayUrl;
              mediaImg.style.display = "block";
            } else {
              mediaImg.style.display = "none";
            }
            mediaVideo.style.display = "none";
            mediaVideo.pause();
          } else if (isVideo) {
            const rawUrl =
              data.url &&
                ![
                  "[uploading]",
                  "[upload-failed]",
                  "[offline-or-failed-upload]",
                  "[local-file]",
                  "[local-only]",
                ].includes(data.url)
                ? data.url
                : (data.localPreview || data.localUrl || (data.path ? `local-file:///${data.path.replace(/\\/g, "/")}` : null));
            const displayUrl = normalizeUrl(rawUrl);

            if (displayUrl) {
              const isSecondary = data.isSecondaryDisplay === true;
              mediaVideo.controls = !isSecondary;
              mediaVideo.style.cursor = isSecondary ? "none" : "default";
              mediaVideo.loop = data.isLooping === true;
              mediaVideo.onended = () => {
                if (mediaVideo.loop) {
                  mediaVideo.currentTime = 0;
                  mediaVideo.play().catch((e) => console.error("[PRESENTATION PRELIST] Loop play error:", e));
                }
              };

              const currentSrc = mediaVideo.currentSrc || mediaVideo.src || "";
              const normalize = (s) => {
                if (!s) return "";
                let str = decodeURIComponent(s).replace(/\\/g, "/").toLowerCase();
                str = str.replace(/^(file|local-file):\/\/\/?/, "");
                if (/^[a-z]\//.test(str)) {
                  str = str[0] + ":/" + str.slice(2);
                }
                return str;
              };
              const isSameVideo = currentSrc && normalize(currentSrc) === normalize(displayUrl);

              if (data.volume !== undefined) {
                mediaVideo.volume = Math.max(0, Math.min(1, data.volume));
              }
              if (data.isMuted !== undefined) {
                mediaVideo.muted = !!data.isMuted;
              }

              mediaVideo.onerror = (e) => {
                console.error("[PRESENTATION PRELIST] mediaVideo error:", mediaVideo.error, displayUrl);
              };

              if (!isSameVideo) {
                mediaVideo.src = displayUrl;
                mediaVideo.load();

                const applyPlayState = () => {
                  if (data.currentTime !== undefined && data.currentTime > 0) {
                    try { mediaVideo.currentTime = data.currentTime; } catch (e) {}
                  }
                  if (data.isPlaying !== false) {
                    mediaVideo
                      .play()
                      .catch((e) => console.error("[PRESENTATION PRELIST] Auto-play failed:", e));
                  } else {
                    mediaVideo.pause();
                  }
                };

                if (mediaVideo.readyState >= 1) {
                  applyPlayState();
                } else {
                  mediaVideo.onloadedmetadata = applyPlayState;
                }
              } else {
                if (data.currentTime !== undefined && Math.abs(mediaVideo.currentTime - data.currentTime) > 1.5) {
                  try { mediaVideo.currentTime = data.currentTime; } catch (e) {}
                }
                if (data.isLooping !== undefined) {
                  mediaVideo.loop = data.isLooping === true;
                }
                if (data.isPlaying === true && mediaVideo.paused) {
                  mediaVideo.play().catch(e => console.error("[PRESENTATION PRELIST] Play error:", e));
                } else if (data.isPlaying === false && !mediaVideo.paused) {
                  mediaVideo.pause();
                }
              }
              mediaArea.style.display = "flex";
              mediaArea.style.opacity = "1";
              mediaVideo.style.display = "block";
            } else {
              mediaVideo.style.display = "none";
              mediaVideo.pause();
            }
            mediaImg.style.display = "none";
          } else {
            // Unknown type
            mediaImg.style.display = "none";
            mediaVideo.style.display = "none";
          }
          return;
        }

        // Otherwise, it's a bible/verse
        mediaArea.style.display = "none";
        mediaVideo.pause();
        verseArea.style.display = "flex";

        const indexStr = data.index || "";
        ref.innerText = indexStr;
        refArea.style.display = indexStr ? "flex" : "none";

        // Wrap words for per-word overflow fix
        tamil.innerHTML = data.tamilText ? wrapWords(data.tamilText) : '';
        eng.innerHTML = data.englishText ? wrapWords(data.englishText) : '';

        // Respect visibility toggles
        const tamilEnabled = data.tamilEnabled !== false;
        tamil.style.display = tamilEnabled ? 'block' : 'none';

        // Use shared lower-third logic for content layout and fitting
        if (layout === 'lowerThird') {
          const layoutOverrides = data.layoutOverrides || {};
          applyLowerThirdContentLayout({ verseArea, box, eng, tamil }, layoutOverrides, data);
          fitLowerThirdTamil(tamil, box, data, eng);
          fitLowerThirdReference(ref, data);
        } else {
          let englishEnabled = data.englishEnabled !== false && getVerseCount(indexStr) <= 2;
          eng.style.display = englishEnabled ? 'block' : 'none';

          // --- MATCH presentation.html LOGIC ---
          const type = getVerseType(
            data.tamilText ? data.tamilText.replace(/<[^>]*>/g, "") : "",
            data.englishText ? data.englishText.replace(/<[^>]*>/g, "") : "",
          );

          const isSingle = !indexStr.includes(",") && !indexStr.includes("-");
          const verseCount = getVerseCount(indexStr);

          const FONT_PRESETS = {
            small: { tamil: 8.2, eng: 6.5, min: 0 },
            medium: { tamil: 6.2, eng: 5.2, min: 3.5 },
            large: { tamil: 4.7, eng: 3.9, min: 2.8 },
            huge: { tamil: 9.8, eng: 7.8, min: 3.0 },
            multi2: { tamil: 5.5, eng: 4.5, min: 3.0 },
            multi: { tamil: 4.2, eng: 3.5, min: 2.0 },
          };

          let effectiveType = type;
          if (isSingle && (type === "small" || type === "medium")) {
            effectiveType = "huge";
          } else if (!isSingle) {
            effectiveType = verseCount === 2 ? "multi2" : "multi";
          }
          const preset = FONT_PRESETS[effectiveType];

          // Line height adjustments with support for layoutOverrides
          const layoutOverrides = data.layoutOverrides || {};
          let tLineHeight = layoutOverrides.tamilLineHeight !== undefined ? layoutOverrides.tamilLineHeight : (!isSingle ? "1.35" : "1.28");
          let eLineHeight = layoutOverrides.englishLineHeight !== undefined ? layoutOverrides.englishLineHeight : "1.35";
          tamil.style.lineHeight = tLineHeight;
          eng.style.lineHeight = eLineHeight;

          let tamilVW = preset.tamil;
          let engVW = preset.eng;

          if (tamilVW < 1.5) tamilVW = 1.5;
          if (engVW < 1.2) engVW = 1.2;

          tamil.style.fontSize = tamilVW + "vw";
          eng.style.fontSize = engVW + "vw";

          // Auto-shrink to fit screen
          let safety = 0;
          while (
            (box.scrollHeight > box.clientHeight ||
              tamil.scrollWidth > box.clientWidth ||
              eng.scrollWidth > box.clientWidth) &&
            tamilVW > preset.min &&
            safety < 120
          ) {
            tamilVW -= 0.1;
            engVW -= 0.08;
            tamil.style.fontSize = tamilVW + "vw";
            eng.style.fontSize = engVW + "vw";
            safety++;
          }

          // Apply font size offsets AFTER auto-shrink
          const offset = data.fontSizeOffset || 0;
          const globalTamilOffset = (data.tamilFontOffset || 0) * 0.15;
          const globalEngOffset = (data.englishFontOffset || 0) * 0.12;

          tamilVW += offset * 0.15 + globalTamilOffset;
          engVW += offset * 0.12 + globalEngOffset;

          tamil.style.fontSize = tamilVW + "vw";
          eng.style.fontSize = engVW + "vw";

          // Fit reference/index (matches regular presentation size & 80% width filling for multi-verse)
          fitReference(ref, data);

          // Layout blocks for fullscreen
          if (type === "small" || type === "medium") {
            box.style.marginTop = "0";
            if (isSingle) {
              verseArea.style.padding = layoutOverrides.versePaddingTop !== undefined ? `${layoutOverrides.versePaddingTop}vh 3vw 0` : "0.5vh 3vw 0";
              box.style.gap = "0";
              box.style.justifyContent = "center";
              verseArea.style.justifyContent = "center";
              box.style.overflow = "hidden";
              box.style.maxHeight = "94%";
              refArea.style.height = "6%";
            } else {
              verseArea.style.padding = layoutOverrides.versePaddingTop !== undefined ? `${layoutOverrides.versePaddingTop}vh 1vw 0` : "1vh 1vw 0";
              box.style.marginTop = "0";
              box.style.gap = "0";
              box.style.overflow = "hidden";
              box.style.justifyContent = "flex-start";
              verseArea.style.justifyContent = "flex-start";
              box.style.maxHeight = "94%";
              refArea.style.height = "5%";
            }
          } else {
            verseArea.style.padding = layoutOverrides.versePaddingTop !== undefined ? `${layoutOverrides.versePaddingTop}vh 1vw 0` : "1vh 1vw 0";
            box.style.marginTop = "0";
            box.style.gap = "0";
            box.style.overflow = "hidden";
            box.style.justifyContent = "flex-start";
            verseArea.style.justifyContent = "flex-start";
            box.style.maxHeight = "94%";
            refArea.style.height = "5%";
          }

          refArea.style.paddingTop = layoutOverrides.indexPaddingTop !== undefined ? `${layoutOverrides.indexPaddingTop}vh` : "2.5vh";
        }

        // Swap display order based on primary language
        const primaryIsEnglish = data.primaryTranslation === "English";
        tamil.style.order = primaryIsEnglish ? "2" : "1";
        eng.style.order = primaryIsEnglish ? "1" : "2";

        // After fitting, fix any individual words that still overflow
        const boxWidth = box.clientWidth;
        fixWordOverflow(tamil, boxWidth);
        fixWordOverflow(eng, boxWidth);
      };

      // Transition
      const contentLayers = [document.getElementById('referenceArea'), document.getElementById('verseArea')];

      if (window.activeTransition) {
        clearTimeout(window.activeTransition);
        window.activeTransition = null;
      }

      if (settings.enableTransition) {
        contentLayers.forEach(l => {
          l.style.transition = "opacity 0.04s ease-out";
          l.style.opacity = "0";
        });

        window.activeTransition = setTimeout(() => {
          applyContent();
          contentLayers.forEach(l => {
            l.style.transition = "opacity 0.06s ease-in";
            l.style.opacity = "1";
          });
          window.activeTransition = null;
        }, 50);
      } else {
        contentLayers.forEach(l => {
          l.style.transition = "";
          l.style.opacity = "1";
        });
        applyContent();
      }
    }

    (function waitAPI() {
      // When running inside an iframe (WYSIWYG preview), presentationAPI is never injected.
      // postMessage listener below handles all data updates instead — so skip the IPC setup.
      if (window.self !== window.top) return;
      if (window.presentationAPI?.onVerse) {
        window.presentationAPI.onVerse(updateDisplay);

        if (window.presentationAPI?.onVideoCommand) {
          window.presentationAPI.onVideoCommand((cmd) => {
            const v = document.getElementById("mediaVideo");
            if (!v) return;
            if (cmd.action === "play") {
              if (cmd.currentTime !== undefined && Math.abs(v.currentTime - cmd.currentTime) > 1.0) {
                try { v.currentTime = cmd.currentTime; } catch (e) {}
              }
              v.play().catch((e) => console.error("Play error:", e));
            } else if (cmd.action === "pause") {
              v.pause();
              if (cmd.currentTime !== undefined && Math.abs(v.currentTime - cmd.currentTime) > 1.0) {
                try { v.currentTime = cmd.currentTime; } catch (e) {}
              }
            } else if (cmd.action === "seek") {
              if (cmd.currentTime !== undefined) {
                try { v.currentTime = cmd.currentTime; } catch (e) {}
              }
              if (cmd.isPlaying) {
                v.play().catch((e) => console.error("Play error:", e));
              } else {
                v.pause();
              }
            } else if (cmd.action === "sync") {
              if (cmd.currentTime !== undefined && Math.abs(v.currentTime - cmd.currentTime) > 1.5) {
                try { v.currentTime = cmd.currentTime; } catch (e) {}
              }
              if (cmd.isPlaying !== undefined) {
                if (cmd.isPlaying && v.paused) {
                  v.play().catch(() => {});
                } else if (!cmd.isPlaying && !v.paused) {
                  v.pause();
                }
              }
            } else if (cmd.action === "volume") {
              if (cmd.volume !== undefined) {
                v.volume = Math.max(0, Math.min(1, cmd.volume));
              }
              if (cmd.isMuted !== undefined) {
                v.muted = !!cmd.isMuted;
              }
            } else if (cmd.action === "loop") {
              if (cmd.isLooping !== undefined) {
                v.loop = !!cmd.isLooping;
              }
            }
          });
        }
      } else {
        setTimeout(waitAPI, 50);
      }
    })();

    const exitBtn = document.getElementById("presentationExit");
    if (exitBtn) {
      exitBtn.addEventListener("click", () => {
        document.body.style.transition = "opacity 0.15s ease-out";
        document.body.style.opacity = "0";
        setTimeout(() => window.presentationAPI?.close?.(), 150);
      });
    }

    // Support for iframe preview integration via postMessage
    window.addEventListener("message", (event) => {
      if (event.data && event.data.type === "SHOW_VERSE") {
        updateDisplay(event.data.payload);
      }
    });

    /* ---------- PHYSICAL KEYBOARD NAVIGATION ---------- */
    document.addEventListener("keydown", (e) => {
      if (!window.presentationAPI) return;
      if (e.key === "Escape") {
        document.body.style.transition = "opacity 0.15s ease-out";
        document.body.style.opacity = "0";
        setTimeout(() => {
          window.presentationAPI.close?.();
        }, 150);
      }
      if (e.key === "ArrowRight" || e.key === "ArrowDown")
        window.presentationAPI.nextVerse?.();
      if (e.key === "ArrowLeft" || e.key === "ArrowUp")
        window.presentationAPI.previousVerse?.();
    });
  </script>
</body>

</html>
