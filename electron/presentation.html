<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Presentation</title>

    <meta
      http-equiv="Content-Security-Policy"
      content="script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';"
    />

    <style>
      :root {
        --bg: #000;
        --text: #fff;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: Arial, sans-serif;
      }

      #container {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
      }

      /* ---------- TOP : REFERENCE ---------- */
      #referenceArea {
        height: 8%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #reference {
        font-weight: 700;
        text-decoration: underline;
        white-space: nowrap;
        overflow: hidden;
        text-align: center;
        opacity: 0.9;
      }

      /* ---------- VERSE AREA (TAMIL + ENGLISH TOGETHER) ---------- */
      #verseArea {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 3vw;
        overflow: hidden;
      }

      #verseBox {
        width: 100%;
        max-height: 80%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        gap: 2.2vh;
        text-align: center;
        overflow: hidden;
      }

      #tamilText {
        font-weight: 900;
        line-height: 1.28;
        letter-spacing: -0.015em;
        white-space: pre-wrap;
        word-break: break-word;
      }

      #englishText {
        font-weight: 600;
        line-height: 1.35;
        letter-spacing: -0.01em;
        opacity: 0.95;
        white-space: pre-wrap;
        word-break: break-word;
      }

      /* ---------- WATERMARK ---------- */
      #watermark {
        position: absolute;
        bottom: 15px;
        right: 25px;
        font-size: 1.2vw;
        opacity: 0.35;
        letter-spacing: 2px;
      }

      /* ---------- FADE (LIGHT, SAFE) ---------- */
      .fade {
        opacity: 0;
        animation: fadeIn 0.45s ease forwards;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>

  <body>
    <div id="container">
      <div id="referenceArea">
        <div id="reference"></div>
      </div>

      <div id="verseArea">
        <div id="verseBox">
          <div id="tamilText"></div>
          <div id="englishText"></div>
        </div>
      </div>

      <div id="watermark"></div>
    </div>

    <script>
      /* ---------- SAFE AUTO-FIT (NO LOOPS) ---------- */
      function fitVerseBox(tamilEl, engEl, box) {
        const MAX_TAMIL = 4.2; // vw
        const MIN_TAMIL = 1.3;

        const ENG_RATIO = 0.68; // 🔥 English ≈ 68% of Tamil

        let tamilVW = MAX_TAMIL;

        tamilEl.style.fontSize = tamilVW + "vw";
        engEl.style.fontSize = tamilVW * ENG_RATIO + "vw";

        let safety = 0;

        while (
          box.scrollHeight > box.clientHeight &&
          tamilVW > MIN_TAMIL &&
          safety < 40
        ) {
          tamilVW -= 0.1;

          tamilEl.style.fontSize = tamilVW + "vw";
          engEl.style.fontSize = tamilVW * ENG_RATIO + "vw";

          safety++;
        }
      }

      function fitReference(el) {
        let vw = 4.8;
        el.style.fontSize = vw + "vw";

        while (el.scrollWidth > el.clientWidth && vw > 2.8) {
          vw -= 0.1;
          el.style.fontSize = vw + "vw";
        }
      }

      /* ---------- SAFE API ---------- */
      function safeOnVerse(cb) {
        if (
          window.presentationAPI &&
          typeof window.presentationAPI.onVerse === "function"
        ) {
          window.presentationAPI.onVerse(cb);
        }
      }

      /* ---------- UPDATE ---------- */
      safeOnVerse((data) => {
        if (!data) return;

        const refEl = document.getElementById("reference");
        const tamilEl = document.getElementById("tamilText");
        const engEl = document.getElementById("englishText");
        const box = document.getElementById("verseBox");
        const watermark = document.getElementById("watermark");

        refEl.className = "";
        refEl.innerText = data.index || "";
        fitReference(refEl);
        void refEl.offsetWidth;
        refEl.className = "fade";

        tamilEl.className = "";
        engEl.className = "";

        tamilEl.innerText = data.tamilText || "";
        engEl.innerText = data.englishText || "";

        fitVerseBox(tamilEl, engEl, box);

        void box.offsetWidth;
        tamilEl.className = "fade";
        engEl.className = "fade";

        watermark.innerText = data.watermark || "Bethel AG Elim";
      });

      /* ---------- KEYS ---------- */
      document.addEventListener("keydown", (e) => {
        if (!window.presentationAPI) return;

        if (e.key === "Escape") window.presentationAPI.close?.();
        if (e.key === "ArrowRight") window.presentationAPI.nextVerse?.();
        if (e.key === "ArrowLeft") window.presentationAPI.previousVerse?.();
      });
    </script>
  </body>
</html>
