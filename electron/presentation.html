<!doctype html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>Presentation</title>

  <meta http-equiv="Content-Security-Policy"
    content="script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" />

  <style>
    :root {
      --bg: #000;
      --text: #fff;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
      animation: windowFadeIn 0.15s ease-in forwards;
    }

    @keyframes windowFadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @font-face {
      font-family: "TamilBibleFont";
      src: url("fonts/NotoSansTamil-SemiBold.ttf") format("truetype");
      font-weight: normal;
      font-style: normal;
    }

    #container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* Fade transition — controlled via JS inline styles */

    /* ---------- REFERENCE ---------- */
    #referenceArea {
      height: 5%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-top: 3.5vh;
      padding-bottom: 0.8vh;
      /* Permanent gap below reference */
    }

    #reference {
      font-weight: bold;
      font-family: "TamilBibleFont", Arial, sans-serif;
      text-decoration: underline;
      text-decoration-color: #b4b4b4ec;
      text-underline-offset: 5px;
      /* Push underline down for Tamil descenders */
      text-decoration-skip-ink: none;
      color: #fff;
      white-space: nowrap;
    }

    /* ---------- VERSE ---------- */
    #verseArea {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 0.5vh 1vw 0;
      /* Added top padding for permanent gap from reference */
    }

    #verseBox {
      width: 100%;
      max-height: 95%;
      /* Increased for more room */
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2vh;
      text-align: center;
      overflow: hidden;
    }

    #tamilText {
      font-family: "TamilBibleFont", Arial, sans-serif;
      font-weight: 900;
      line-height: 1.28;
      /* keep-all: never break mid-grapheme-cluster; anywhere: break URLs/long runs if needed */
      word-break: keep-all;
      overflow-wrap: anywhere;
      max-width: 100%;
    }

    #englishText {
      font-weight: 600;
      line-height: 1.35;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    /* Shrink individual oversized words without breaking the whole line */
    .word-shrink {
      display: inline-block;
      max-width: 100%;
      overflow: visible;
      white-space: nowrap;
      /* Prevent individual words from wrapping internally */
    }

    /* ---------- WATERMARK ---------- */
    #watermark {
      position: absolute;
      bottom: 15px;
      right: 25px;
      font-size: 1.5vw;
      opacity: 1.5;
    }

    #bgLayer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background-color: #000;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition: background-image 0.5s ease, background-color 0.5s ease;
    }

    /* GLOBAL FADE-IN ON OPEN */
    body {
      opacity: 0;
      transition: opacity 0.3s ease-in;
    }

    body.ready {
      opacity: 1;
    }
  </style>
</head>

<body>
  <div id="bgLayer"></div>
  <div id="container">
    <div id="referenceArea">
      <div id="reference"></div>
    </div>

    <div id="verseArea">
      <div id="verseBox">
        <div id="tamilText"></div>
        <div id="englishText"></div>
      </div>
    </div>

    <div id="watermark"></div>
  </div>
  <script>
    /* ---------- VERSE TYPE ---------- */
    function getVerseType(tamil, english) {
      const len = (tamil?.length || 0) * 1.2 + (english?.length || 0);
      if (len < 80) return "small";
      if (len > 250) return "large";
      return "medium";
    }

    /* ---------- VERSE CHECK ---------- */
    function isSingleVerse(indexStr) {
      if (!indexStr) return true;
      return !indexStr.includes(",") && !indexStr.includes("-");
    }

    function getVerseCount(indexStr) {
      if (!indexStr) return 1;
      const tamilText = document.getElementById("tamilText").innerHTML || "";
      const lines = tamilText.split("<br>").filter((l) => l.trim()).length;
      if (lines > 1) return lines;
      const rangeMatch = indexStr.match(/:(\d+)-(\d+)/);
      if (rangeMatch)
        return parseInt(rangeMatch[2]) - parseInt(rangeMatch[1]) + 1;
      return 1;
    }

    /* ---------- FONT PRESETS ---------- */
    const FONT_PRESETS = {
      small: { tamil: 8.2, eng: 6.5, min: 0 },
      medium: { tamil: 6.2, eng: 5.2, min: 3.5 },
      large: { tamil: 4.7, eng: 3.9, min: 2.8 },
      huge: { tamil: 9.8, eng: 7.8, min: 3.0 },
      multi2: { tamil: 5.5, eng: 4.5, min: 3.0 }, // For exactly 2 verses
      multi: { tamil: 4.2, eng: 3.5, min: 2.0 }, // For >2 verses
    };

    /* ---------- SAFE FIT ---------- */
    function fitVerseBox(tamilEl, engEl, box, type, isSingle, verseCount, data = {}) {
      let effectiveType = type;
      if (isSingle && (type === "small" || type === "medium")) {
        effectiveType = "huge";
      } else if (!isSingle) {
        effectiveType = verseCount === 2 ? "multi2" : "multi";
      }

      const preset = FONT_PRESETS[effectiveType];

      // Apply settings offsets (from Bible Tab Font Size settings)
      // Each offset unit = 0.15vw adjustment
      const tamilOffset = (data.tamilFontOffset || 0) * 0.15;
      const engOffset = (data.englishFontOffset || 0) * 0.12;

      let tamilVW = preset.tamil;
      let engVW = preset.eng;

      // Clamp minimums
      if (tamilVW < 1.5) tamilVW = 1.5;
      if (engVW < 1.2) engVW = 1.2;

      // Force lowerThird to start smaller so it fits well within the 15.5vh box
      if (data && data.presentationLayout === 'lowerThird') {
        tamilVW = 4.5;
        engVW = 3.5;
      }

      tamilEl.style.fontSize = tamilVW + "vw";
      engEl.style.fontSize = engVW + "vw";

      // Always auto-shrink to fit screen - Bible tab must fit all text
      let safety = 0;
      while (
        (box.scrollHeight > box.clientHeight ||
          tamilEl.scrollWidth > box.clientWidth ||
          engEl.scrollWidth > box.clientWidth) &&
        tamilVW > preset.min &&
        safety < 120
      ) {
        tamilVW -= 0.1;
        engVW -= 0.08;

        tamilEl.style.fontSize = tamilVW + "vw";
        engEl.style.fontSize = engVW + "vw";

        safety++;
      }

      // Apply offset AFTER auto-shrink has found the container bounds
      tamilVW += tamilOffset;
      engVW += engOffset;
      tamilEl.style.fontSize = tamilVW + "vw";
      engEl.style.fontSize = engVW + "vw";
    }

    /* ---------- REF FIT ---------- */
    function fitReference(el, data) {
      const text = (el.innerText || "").toLowerCase();
      const isSmallRef =
        text.includes("revelation") ||
        text.includes("வெளிப்படுத்தின") ||
        text.includes("thessalonians") ||
        text.includes("தெச");

      const isMultiVerse = text.includes("-") || text.includes(",");
      const isLongText = text.length > 20;

      let vw = (isSmallRef || (isMultiVerse && isLongText)) ? 4.2 : 5.5;

      // Apply lower third scaling
      if (data && data.presentationLayout === 'lowerThird') {
        vw *= 0.28; // Significantly smaller for bottom right
      }

      el.style.fontSize = vw + "vw";
      while (el.scrollWidth > el.clientWidth && vw > 2.5) {
        vw -= 0.1;
        el.style.fontSize = vw + "vw";
      }

      // Apply index font offset
      const indexOffset = (data && data.indexFontOffset ? data.indexFontOffset : 0) * 0.15;
      const localOffset = (data && data.fontSizeOffset ? data.fontSizeOffset : 0) * 0.10;
      vw += indexOffset + localOffset;
      el.style.fontSize = vw + "vw";
    }

    /* ---------- UPDATE ---------- */
    function getSafeBgUrl(imgPath) {
      if (!imgPath) return 'none';
      const clean = imgPath.replace(/\\/g, '/');
      if (clean.startsWith('http') || clean.startsWith('data:')) return `url("${clean}")`;
      if (!clean.startsWith('file:///')) return `url("file:///${clean}")`;
      return `url("${clean}")`;
    }

    function updateVerse(data) {
      const ref = document.getElementById("reference");
      const tamil = document.getElementById("tamilText");
      const eng = document.getElementById("englishText");
      const box = document.getElementById("verseBox");
      const verseArea = document.getElementById("verseArea");
      const refArea = document.getElementById("referenceArea");

      if (data && data.fadeOutOnly) {
        document.body.style.transition = 'opacity 0.25s ease-out';
        document.body.style.opacity = '0';
        return;
      }

      if (!data) {
        ref.innerText = "";
        tamil.innerText = "";
        eng.innerText = "";
        return;
      }

      document.body.classList.add('ready');
      document.body.style.opacity = ''; // reset if it was faded out
      document.body.style.transition = '';


      // ----- APPLY SETTINGS -----

      // Background - Cached
      const bgLayer = document.getElementById('bgLayer');
      const container = document.getElementById('container');
      const bgType = data.presentationBgType || 'black';
      const layout = data.presentationLayout || 'fullscreen';

      // Initialize cache if needed
      if (!window.bgCache) {
        window.bgCache = { type: null, val: null, layout: null };
        bgLayer.style.backgroundColor = "black";
        bgLayer.style.backgroundImage = "none";
      }

      // Handle Layout
      if (layout === 'lowerThird') {
        container.style.justifyContent = 'flex-end';
        container.style.paddingBottom = '3vh'; // Push up from bottom slightly
        verseArea.style.flex = 'none'; // Disable flex stretch
        
        box.style.alignItems = 'flex-start';
        box.style.textAlign = 'left';
        
        // Fade out entirely if not a single verse
        if (!isSingleVerse(data.index)) {
          document.body.style.opacity = '0';
          return;
        }
        
        refArea.style.position = 'absolute';
        refArea.style.alignSelf = 'auto';
        refArea.style.bottom = '3.5vh'; // Float just above the 3vh bottom padding
        refArea.style.right = '2vw'; // Float on the right edge
        refArea.style.padding = '0';
        refArea.style.paddingTop = '0';
        refArea.style.paddingRight = '0'; // No internal padding needed since it's floating
        refArea.style.minHeight = 'auto';
        refArea.style.display = 'block';

        const watermark = document.getElementById("watermark");
        if (watermark) watermark.style.display = 'none';
        refArea.style.minHeight = 'auto';
        refArea.style.display = 'block';
        
        // Re-order the elements so index appears below the verse
        verseArea.style.order = '1';
        refArea.style.order = '2';

        if (data.lowerThirdBgImage) {
          if (window.bgCache.type !== 'lowerThirdImage' || window.bgCache.val !== data.lowerThirdBgImage || window.bgCache.layout !== layout) {
            bgLayer.style.backgroundImage = getSafeBgUrl(data.lowerThirdBgImage);
            bgLayer.style.backgroundColor = 'transparent';

            // Constrain background to the lower-third area
            bgLayer.style.top = 'auto';
            bgLayer.style.bottom = '3vh'; // Align exactly with container's paddingBottom
            bgLayer.style.height = '15.5vh';
            bgLayer.style.backgroundSize = '100% 100%';
            
            window.bgCache = { type: 'lowerThirdImage', val: data.lowerThirdBgImage, layout };
          }
        } else {
          // Force background to transparent
          bgLayer.style.backgroundImage = 'none';
          bgLayer.style.backgroundColor = 'transparent';

          // Constrain background to the lower-third area
          bgLayer.style.top = 'auto';
          bgLayer.style.bottom = '3vh'; // Align exactly with container's paddingBottom
          bgLayer.style.height = '15.5vh';
          bgLayer.style.backgroundSize = '100% 100%';

          window.bgCache = { type: 'transparent', val: null, layout: 'lowerThird' };
        }
        document.body.style.backgroundColor = 'transparent'; // Ensure body is transparent
      } else {
        container.style.justifyContent = 'flex-start';
        container.style.paddingBottom = '0';
        verseArea.style.flex = '1'; // Restore flex stretch
        
        box.style.alignItems = 'center';
        box.style.textAlign = 'center';
        
        refArea.style.position = 'static';
        refArea.style.bottom = 'auto';
        refArea.style.right = 'auto';
        refArea.style.padding = '';
        refArea.style.paddingTop = '3.5vh';
        refArea.style.minHeight = '5%';
        refArea.style.display = 'flex';
        
        verseArea.style.order = '';
        refArea.style.order = '';

        document.body.style.backgroundColor = 'var(--bg)'; // Reset body

        // Reset bgLayer to fullscreen
        bgLayer.style.top = '0';
        bgLayer.style.bottom = 'auto';
        bgLayer.style.height = '100%';
        bgLayer.style.backgroundSize = 'cover';

        const watermark = document.getElementById("watermark");
        if (watermark) watermark.style.display = 'block';

        if (bgType === 'image' && data.presentationBgImage) {
          // Compare with cache
          if (window.bgCache.type !== 'image' || window.bgCache.val !== data.presentationBgImage || window.bgCache.layout !== layout) {
            bgLayer.style.backgroundImage = getSafeBgUrl(data.presentationBgImage);
            bgLayer.style.backgroundColor = 'transparent';
            window.bgCache = { type: 'image', val: data.presentationBgImage, layout };
          }
        } else if (bgType === 'white') {
          if (window.bgCache.type !== 'white' || window.bgCache.layout !== layout) {
            bgLayer.style.backgroundImage = 'none';
            bgLayer.style.backgroundColor = '#ffffff';
            window.bgCache = { type: 'white', val: null, layout };
          }
        } else if (bgType === 'custom' && data.presentationBgColor) {
          if (window.bgCache.type !== 'custom' || window.bgCache.val !== data.presentationBgColor || window.bgCache.layout !== layout) {
            bgLayer.style.backgroundImage = 'none';
            bgLayer.style.backgroundColor = data.presentationBgColor;
            window.bgCache = { type: 'custom', val: data.presentationBgColor, layout };
          }
        } else {
          // Default black
          if (window.bgCache.type !== 'black' || window.bgCache.layout !== layout) {
            bgLayer.style.backgroundImage = 'none';
            bgLayer.style.backgroundColor = '#000000';
            window.bgCache = { type: 'black', val: null, layout };
          }
        }
      }

      // Text color
      let textColor = data.presentationTextColor || '#fff';
      if (layout === 'lowerThird' && data.lowerThirdTextColor) {
        textColor = data.lowerThirdTextColor;
      }
      document.body.style.color = textColor;
      ref.style.color = textColor;
      ref.style.textDecorationColor = textColor === 'black' || textColor === '#000000' ? '#444' : '#b4b4b4ec';
      tamil.style.color = textColor;
      eng.style.color = textColor;

      // Watermark
      const watermark = document.getElementById('watermark');
      if (watermark) {
        watermark.innerText = data.customWatermark || '';
        watermark.style.color = textColor;
      }

      // Transition
      const contentLayers = [document.getElementById('referenceArea'), document.getElementById('verseArea')];

      // Interrupt any existing transition
      if (window.activeTransition) {
        clearTimeout(window.activeTransition);
        window.activeTransition = null;
      }

      if (data.enableTransition) {
        // Fade OUT content only
        contentLayers.forEach(l => {
          l.style.transition = 'opacity 0.04s ease-out';
          l.style.opacity = '0';
        });

        window.activeTransition = setTimeout(() => {
          applyBibleContent(data, ref, refArea, tamil, eng, box, verseArea);

          contentLayers.forEach(l => {
            l.style.transition = 'opacity 0.06s ease-in';
            l.style.opacity = '1';
          });
          window.activeTransition = null;
        }, 50);
      } else {
        contentLayers.forEach(l => {
          l.style.transition = '';
          l.style.opacity = '1';
        });
        applyBibleContent(data, ref, refArea, tamil, eng, box, verseArea);
      }
    }

    /* ---------- APPLY BIBLE CONTENT ---------- */
    /* ---------- WORD OVERFLOW FIX ---------- */
    /* Wraps each word in a span; shrinks only words that overflow their container */
    function fixWordOverflow(el, containerWidth) {
      const words = el.querySelectorAll('.word-shrink');
      words.forEach(span => {
        // Reset any previous shrink
        span.style.fontSize = '';
        if (span.scrollWidth > containerWidth) {
          let fs = parseFloat(window.getComputedStyle(span).fontSize);
          while (span.scrollWidth > containerWidth && fs > 5) {
            fs -= 0.3; // Smaller decrements for smoother fit
            span.style.fontSize = fs + 'px';
          }
        }
      });
    }

    /* Converts plain text to HTML with each word wrapped in .word-shrink span */
    function wrapWords(text) {
      if (!text) return '';

      // 1. Glue punctuations (.,:;!?) to the preceding word if they have a leading space in JSON
      // This ensures they stay in the same .word-shrink span and don't wrap alone
      const glued = text.replace(/\s+([.,:;!?])/g, '$1');

      // Split on whitespace, preserve line breaks
      return glued
        .split(/(\n)/)
        .map(segment => {
          if (segment === '\n') return '<br>';
          return segment
            .split(/\s+/)
            .filter(w => w.length > 0)
            .map(w => `<span class="word-shrink">${w}</span>`)
            .join(' ');
        })
        .join('');
    }

    function applyBibleContent(data, ref, refArea, tamil, eng, box, verseArea) {
      const indexStr = data.index || "";
      ref.innerText = indexStr;
      // Use wrapWords to wrap each word for per-word overflow shrink
      tamil.innerHTML = data.tamilText ? wrapWords(data.tamilText) : '';
      eng.innerHTML = data.englishText ? wrapWords(data.englishText) : '';

      // Get verse count from index
      const getVerseCount = (idxStr) => {
        const match = idxStr.match(/(\d+):(\d+)(?:-(\d+))?(?:\s*,\s*(\d+))?/);
        if (!match) return 1;
        if (match[3]) return parseInt(match[3]) - parseInt(match[2]) + 1;
        if (match[4]) return 2;
        return 1;
      };
      const verseCount = getVerseCount(indexStr);

      // Respect visibility toggles and max verses
      tamil.style.display = data.tamilEnabled === false ? 'none' : 'block';
      if (data.presentationLayout === 'lowerThird') {
        eng.style.display = 'none'; // Force hide English in lower-third
      } else {
        eng.style.display = (data.englishEnabled === false || verseCount > 2) ? 'none' : 'block';
      }

      fitReference(ref, data);

      const type = getVerseType(
        data.tamilText ? data.tamilText.replace(/<[^>]*>/g, "") : "",
        data.englishText ? data.englishText.replace(/<[^>]*>/g, "") : "",
      );
      const isSingle = isSingleVerse(indexStr);

      if (!isSingle) {
        tamil.style.lineHeight = "1.35";
        eng.style.lineHeight = "1.35";
      } else {
        tamil.style.lineHeight = "1.28";
        eng.style.lineHeight = "1.35";
      }

      if (data.presentationLayout === 'lowerThird') {
        verseArea.style.padding = "0 8vw 0 20vw"; // Padding from the left instead of right
        box.style.marginTop = "0";
        box.style.gap = "0";
        box.style.overflow = "hidden";
        box.style.justifyContent = "center"; // Center the text within the fixed background block!
        verseArea.style.justifyContent = "center";
        box.style.minHeight = "15.5vh";
        box.style.maxHeight = "15.5vh";
      } else if (type === "small" || type === "medium") {
        box.style.marginTop = "0";

        if (isSingle) {
          verseArea.style.padding = "1vh 3vw 0";
          box.style.gap = "0";
          box.style.justifyContent = "center";
          verseArea.style.justifyContent = "center";
          box.style.overflow = "hidden";
          box.style.maxHeight = "94%";
          refArea.style.height = "6%";
        } else {
          verseArea.style.padding = "1vh 1vw 0";
          box.style.marginTop = "0";
          box.style.gap = "0";
          box.style.overflow = "hidden";
          box.style.justifyContent = "flex-start";
          verseArea.style.justifyContent = "flex-start";
          box.style.maxHeight = "94%";
          refArea.style.height = "5%";
        }
      } else {
        verseArea.style.padding = "1vh 1vw 0";
        box.style.marginTop = "0";
        box.style.gap = "0";
        box.style.overflow = "hidden";
        box.style.justifyContent = "flex-start";
        verseArea.style.justifyContent = "flex-start";
        box.style.maxHeight = "94%";
        refArea.style.height = "5%";
      }

      fitVerseBox(tamil, eng, box, type, isSingle, verseCount, data);

      // Swap display order based on primary language
      const primaryIsEnglish = data.primaryTranslation === "English";
      tamil.style.order = primaryIsEnglish ? "2" : "1";
      eng.style.order = primaryIsEnglish ? "1" : "2";

      // After fitting, fix any individual words that still overflow
      const boxWidth = box.clientWidth;
      fixWordOverflow(tamil, boxWidth);
      fixWordOverflow(eng, boxWidth);
    }

    /* ---------- ELECTRON API ---------- */
    (function waitAPI() {
      if (window.presentationAPI?.onVerse) {
        window.presentationAPI.onVerse(updateVerse);
      } else {
        setTimeout(waitAPI, 50);
      }
    })();

    /* ---------- KEYS ---------- */
    document.addEventListener("keydown", (e) => {
      if (!window.presentationAPI) return;
      if (e.key === "Escape") {
        document.body.style.transition = "opacity 0.15s ease-out";
        document.body.style.opacity = "0";
        setTimeout(() => {
          window.presentationAPI.close?.();
        }, 150);
      }
      if (e.key === "ArrowRight") window.presentationAPI.nextVerse?.();
      if (e.key === "ArrowLeft") window.presentationAPI.previousVerse?.();
    });
  </script>
</body>

</html>
